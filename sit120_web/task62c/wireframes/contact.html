<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lens: {
              teal: "#155E63",
              cream: "#F6F3EA",
              orange: "#B64900",
              ink: "#17383A",
              pale: "#E5EFEC"
            }
          }
        }
      }
    }
  </script>

  <title>LabelLens — Contact Us Wireframe</title>
</head>

<body class="min-h-screen bg-lens-cream text-lens-ink">
  <div class="mx-auto min-h-screen max-w-7xl bg-white shadow-sm">
    <header class="flex items-center justify-between border-b border-stone-200 px-5 py-4 md:px-10">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-lens-teal"></div>
        <span class="font-semibold">LabelLens</span>
      </a>

      <nav class="hidden items-center gap-7 text-sm md:flex">
        <a href="index.html">Home</a>
        <a href="scan-confirm.html">Scan</a>
        <a href="additive-results.html">Compare</a>
        <a href="contact.html" class="font-semibold text-lens-orange">Contact</a>
        <div class="h-9 w-24 rounded-full bg-lens-teal"></div>
      </nav>

      <div class="h-10 w-10 rounded-xl border border-stone-300 md:hidden"></div>
    </header>

    <main class="px-5 py-8 md:px-10 md:py-14">
      <div class="mb-8">
        <p class="text-xs uppercase tracking-[0.2em] text-lens-orange">Get in touch</p>
        <div class="mt-3 h-10 w-64 max-w-full rounded-lg bg-lens-teal"></div>
        <div class="mt-4 h-3 w-96 max-w-full rounded bg-stone-200"></div>
      </div>

      <section class="grid gap-6 lg:grid-cols-[1fr_.85fr]">

        <form class="rounded-[2rem] border border-stone-200 bg-lens-cream p-5 md:p-8">

          <!-- Related-fields group: your details -->
          <div class="rounded-2xl bg-white p-5">
            <div class="mb-1 h-4 w-28 rounded bg-lens-teal"></div>
            <p class="mb-4 text-xs text-stone-500">Group — Your details</p>
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="block">
                <span class="text-xs uppercase tracking-wide text-stone-500">Name</span>
                <div class="mt-2 h-11 rounded-xl border border-stone-300 bg-stone-50"></div>
              </label>
              <label class="block">
                <span class="text-xs uppercase tracking-wide text-stone-500">Email</span>
                <div class="mt-2 h-11 rounded-xl border border-stone-300 bg-stone-50"></div>
              </label>
            </div>
          </div>

          <!-- Reason for contact -->
          <div class="mt-4 rounded-2xl bg-white p-5">
            <span class="text-xs uppercase tracking-wide text-stone-500">Reason for contact</span>
            <div class="mt-3 h-11 rounded-xl border border-stone-300 bg-stone-50"></div>
          </div>

          <!-- Message -->
          <div class="mt-4 rounded-2xl bg-white p-5">
            <span class="text-xs uppercase tracking-wide text-stone-500">Message</span>
            <div class="mt-3 h-28 rounded-xl border border-stone-300 bg-stone-50"></div>
          </div>

          <!-- Attachment -->
          <div class="mt-4 rounded-2xl bg-white p-5">
            <span class="text-xs uppercase tracking-wide text-stone-500">Attach a photo (optional)</span>
            <div class="mt-3 flex min-h-[96px] items-center justify-center rounded-xl border-2 border-dashed border-stone-300 bg-stone-50">
              <span class="rounded-full bg-lens-pale px-4 py-2 text-xs text-lens-ink">
                Drop file / choose file
              </span>
            </div>
          </div>

          <!-- Reset / submit -->
          <div class="mt-6 grid gap-3 sm:grid-cols-2">
            <button type="reset" class="flex h-14 items-center justify-center rounded-2xl border border-lens-teal text-sm font-medium">
              Reset
            </button>
            <button type="submit" class="flex h-14 items-center justify-center rounded-2xl bg-lens-orange text-sm font-medium text-white">
              Send message
            </button>
          </div>
        </form>

        <aside class="space-y-5">
          <div class="rounded-[2rem] bg-lens-teal p-6 md:p-8 text-white">
            <div class="h-5 w-32 rounded bg-white/80"></div>
            <div class="mt-4 space-y-2">
              <div class="h-3 w-full rounded bg-white/20"></div>
              <div class="h-3 w-4/5 rounded bg-white/20"></div>
            </div>
          </div>
          <div class="rounded-[2rem] border border-stone-200 bg-white p-6 md:p-8">
            <div class="h-4 w-24 rounded bg-lens-teal"></div>
            <div class="mt-4 space-y-3">
              <div class="h-3 w-full rounded bg-stone-200"></div>
              <div class="h-3 w-2/3 rounded bg-stone-200"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <footer class="border-t border-stone-200 px-5 py-8 md:px-10">
      <div class="grid gap-8 md:grid-cols-4">
        <div class="space-y-3">
          <div class="h-9 w-28 rounded-lg bg-lens-teal"></div>
          <div class="h-3 w-full rounded bg-stone-200"></div>
          <div class="h-3 w-2/3 rounded bg-stone-200"></div>
        </div>
        <div class="space-y-3">
          <div class="h-4 w-20 rounded bg-stone-300"></div>
          <div class="h-3 w-24 rounded bg-stone-200"></div>
          <div class="h-3 w-20 rounded bg-stone-200"></div>
        </div>
        <div class="space-y-3">
          <div class="h-4 w-20 rounded bg-stone-300"></div>
          <div class="h-3 w-24 rounded bg-stone-200"></div>
          <div class="h-3 w-20 rounded bg-stone-200"></div>
        </div>
        <div class="space-y-3">
          <div class="h-4 w-20 rounded bg-stone-300"></div>
          <div class="h-10 w-full rounded-full border border-stone-300"></div>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
